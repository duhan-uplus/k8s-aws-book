name: Batch App Build & Docker Push

on:
  push:
    branches: [ "master" ]
    paths:
      - 'batch-app/**'
      - '.github/workflows/build-batch.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./batch-app

    steps:
    - uses: actions/checkout@v3

    # 1. Java 11
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'corretto'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 2. Gradle 빌드
    - name: Build with Gradle
      run: ./gradlew clean build -x test

    # 3. Docker Hub 로그인
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. Docker 빌드 (ARG로 파일명 전달)
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: ./batch-app
        file: ./batch-app/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/batch-app:latest
        build-args: |
          JAR_FILE=build/libs/batch-app-1.0.0.jar


