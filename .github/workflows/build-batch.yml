name: Batch App Build & Docker Push

on:
  push:
    branches: [ "master" ]
    paths:
      - 'batch-app/**'
      - '.github/workflows/build-batch.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # 기존 성공 방식 유지

    defaults:
      run:
        working-directory: ./batch-app

    steps:
    - uses: actions/checkout@v3

    # 1. Java 11 설정 (기존과 동일)
    - name: Set up JDK 11 (Corretto)
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'corretto'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 2. Gradle 빌드 (S3 Mock 테스트 실패 방지 위해 -x test)
    - name: Build with Gradle
      run: ./gradlew clean build -x test

    # [핵심 수정] 빌드된 JAR를 Dockerfile이 찾는 'app.jar' 이름으로 복사!
    - name: Prepare JAR for Docker
      run: |
        echo "Moving built jar to app.jar..."
        cp build/libs/*.jar app.jar
        ls -lh app.jar  # 파일 사이즈 확인용 (로그에 찍힘)

    # 3. Docker Hub 로그인
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. Docker 이미지 빌드 및 푸시
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: ./batch-app
        file: ./batch-app/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/batch-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/batch-app:${{ github.sha }}

